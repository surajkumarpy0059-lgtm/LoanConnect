<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoanConnect</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:#073b78;color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:800}.brand b{color:#ff9b14}button{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#1167d8;color:#fff}.light{background:#e8eef7;color:#073b78}main{max-width:1100px;margin:auto;padding:18px}.hero,.panel,.loan{background:#fff;border:1px solid #e1e7ef;border-radius:15px;padding:18px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.loan{cursor:pointer}.loan:hover{box-shadow:0 6px 20px #0001}.loan h3{margin:8px 0}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field input,.field select{padding:11px;border:1px solid #ccd5e2;border-radius:8px}.hidden{display:none}.msg{padding:12px;background:#eef7ff;border-radius:9px;margin-top:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.status{padding:5px 9px;border-radius:20px;background:#eaf7ef;color:#159447;font-size:12px;font-weight:bold}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e5e9ef;text-align:left;font-size:13px}@media(max-width:600px){main{padding:10px}.brand{font-size:19px}}
</style></head><body><header><div class="brand">Loan<b>Connect</b></div><div><button class="light" onclick="customer()">Customer</button> <button class="light" onclick="login()">Admin</button></div></header><main><section id="customer"><div class="hero"><h1>हर सपने के लिए सही Loan</h1><p>All Types of Loans • Easy Application</p></div><div class="grid" id="loans"></div><div id="apply" class="panel hidden"><h2 id="title">Loan Application</h2><div class="form"><div class="field"><label>पूरा नाम</label><input id="name"></div><div class="field"><label>Mobile</label><input id="mobile" maxlength="10"></div><div class="field"><label>PAN</label><input id="pan" maxlength="10"></div><div class="field"><label>Monthly Income</label><input id="income" type="number"></div><div class="field"><label>Loan Amount</label><input id="amount" type="number"></div></div><div class="tabs"><button class="primary" onclick="applyLoan()">Apply Now</button><button class="light" onclick="cibil()">Check Real CIBIL</button></div><div id="msg"></div></div><div class="panel"><h2>My Applications</h2><div id="mine">No applications yet.</div></div></section><section id="admin" class="hidden"><div class="hero"><h1>Owner Admin Panel</h1><p>Only the authorized owner should access this area.</p></div><div class="panel"><button class="light" onclick="customer()">Back to Customer</button><div id="adminData" style="margin-top:12px"></div></div></section></main><script>const types=['Home Loan','Loan Against Property (LAP)','Business Loan','Personal Loan','Car Loan','Two-Wheeler Loan','Education Loan','Machinery Loan','Balance Transfer / Top-Up','Mortgage Loan','Loan Against Rent','Construction Loan'];let selected='',apps=JSON.parse(localStorage.getItem('lc_apps')||'[]');const $=id=>document.getElementById(id);types.forEach((x,i)=>{let d=document.createElement('div');d.className='loan';d.innerHTML='<div style="font-size:28px">'+['🏠','🏢','💼','💳','🚗','🏍️','🎓','⚙️','🔄','🏦','🏠','🏗️'][i]+'</div><h3>'+x+'</h3><small>Apply online</small>';d.onclick=()=>{selected=x;$('title').textContent=x;$('apply').classList.remove('hidden');scrollTo(0,$('apply').offsetTop)};$('loans').appendChild(d)});function customer(){$('customer').classList.remove('hidden');$('admin').classList.add('hidden');render()}function applyLoan(){if(!$('name').value||!/^\d{10}$/.test($('mobile').value)||!$('amount').value){$('msg').innerHTML='<div class="msg">नाम, 10 digit mobile और loan amount भरें।</div>';return}let a={id:'LC'+Date.now().toString().slice(-8),name:$('name').value,mobile:$('mobile').value,pan:$('pan').value,loan:selected,amount:Number($('amount').value),income:Number($('income').value||0),status:'Applied',date:new Date().toLocaleDateString('en-IN')};apps.push(a);localStorage.setItem('lc_apps',JSON.stringify(apps));$('msg').innerHTML='<div class="msg"><b>Application submitted.</b><br>Application ID: '+a.id+'</div>';render()}function render(){if(!apps.length){$('mine').textContent='No applications yet.';return}$('mine').innerHTML='<table><tr><th>ID</th><th>Loan</th><th>Amount</th><th>Status</th></tr>'+apps.map(a=>'<tr><td>'+a.id+'</td><td>'+a.loan+'</td><td>₹'+a.amount.toLocaleString('en-IN')+'</td><td><span class="status">'+a.status+'</span></td></tr>').join('')+'</table>'}function login(){let e=prompt('Owner email');let p=prompt('Owner password');if(e==='owner@example.com'&&p==='CHANGE_ME'){ $('customer').classList.add('hidden');$('admin').classList.remove('hidden');admin()}else alert('Invalid owner credentials. Production app must use secure backend authentication.')}function admin(){let rows=apps.map((a,i)=>'<tr><td>'+a.id+'</td><td>'+a.name+'<br>'+a.mobile+'</td><td>'+a.loan+'</td><td>₹'+a.amount.toLocaleString('en-IN')+'</td><td><select onchange="status('+i+',this.value)"><option>Applied</option><option>Under Process</option><option>Approved</option><option>Rejected</option><option>Disbursed</option></select></td></tr>').join('');$('adminData').innerHTML='<h2>Applications ('+apps.length+')</h2><table><tr><th>ID</th><th>Customer</th><th>Loan</th><th>Amount</th><th>Status</th></tr>'+rows+'</table>'}function status(i,s){apps[i].status=s;localStorage.setItem('lc_apps',JSON.stringify(apps));admin();render()}function cibil(){let pan=prompt('Customer PAN (consent required)');if(!pan)return;alert('Real CIBIL is not connected in this APK yet. No fake score is shown. Connect an authorized CIBIL/provider backend to return the real report.')}render();</script></body></html>
