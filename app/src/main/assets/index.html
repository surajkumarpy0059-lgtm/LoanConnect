<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LoanConnect</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}header{background:#073b78;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.brand{font-size:24px;font-weight:800}.brand b{color:#ff9b14}button{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#1167d8;color:#fff}.dark{background:#073b78;color:#fff}.light{background:#e8eef7;color:#073b78}.danger{background:#fee2e2;color:#b42318}.success{background:#e9f8ef;color:#147a3d}.hidden{display:none!important}main{max-width:1150px;margin:auto;padding:16px}.hero,.panel,.loan,.card{background:#fff;border:1px solid #e0e7f0;border-radius:15px;padding:17px;margin-bottom:14px}.hero{background:linear-gradient(135deg,#073b78,#1167d8);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.loan{cursor:pointer;transition:.15s}.loan:hover{transform:translateY(-2px);box-shadow:0 7px 22px #0001}.loan h3{margin:8px 0;font-size:17px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field input,.field select{padding:11px;border:1px solid #ccd5e2;border-radius:8px;width:100%}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.msg{padding:11px;border-radius:9px;background:#eef7ff;margin-top:10px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat{padding:14px;border:1px solid #e2e7ee;border-radius:12px;background:#fff}.stat b{display:block;font-size:24px;margin-top:5px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:9px;border-bottom:1px solid #e5e9ef;text-align:left;font-size:13px;vertical-align:top}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#eaf7ef;color:#147a3d;font-size:12px;font-weight:bold}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.modalbox{background:#fff;border-radius:15px;padding:20px;width:min(480px,100%);max-height:90vh;overflow:auto}.small{font-size:12px;color:#65738a}.right{float:right}@media(max-width:600px){main{padding:10px}.brand{font-size:20px}}
</style>
</head>
<body>
<header><div class="brand">Loan<b>Connect</b></div><div><button class="light" onclick="showCustomer()">Customer</button> <button class="light" onclick="openLogin()">Admin</button></div></header>
<main>
<section id="customer">
<div class="hero"><h1>हर सपने के लिए सही Loan</h1><p>Loan application, status tracking और lender selection एक जगह।</p><button class="light" onclick="openCustomerLogin()">Mobile Login</button></div>
<div class="panel"><h2>Loan Types</h2><div class="grid" id="loans"></div></div>
<div id="apply" class="panel hidden"><h2 id="title">Loan Application</h2><div class="form">
<div class="field"><label>पूरा नाम *</label><input id="name"></div><div class="field"><label>Mobile *</label><input id="mobile" inputmode="numeric" maxlength="10"></div><div class="field"><label>PAN</label><input id="pan" maxlength="10" style="text-transform:uppercase"></div><div class="field"><label>Monthly Income</label><input id="income" type="number"></div><div class="field"><label>Loan Amount *</label><input id="amount" type="number"></div><div class="field"><label>Preferred Bank / Lender</label><select id="bank"></select></div>
</div><div class="tabs"><button class="primary" onclick="applyLoan()">Apply Now</button><button class="light" onclick="cibilRequest()">Check CIBIL</button></div><div id="msg"></div></div>
<div class="panel"><h2>My Applications</h2><div id="mine">Mobile login करके applications देखें।</div></div>
</section>
<section id="admin" class="hidden"><div class="hero"><h1>Owner Admin Panel</h1><p>Applications, customers, lenders और CIBIL requests manage करें।</p></div><div class="nav"><button class="dark" onclick="adminTab('dashboard')">Dashboard</button><button class="light" onclick="adminTab('apps')">Applications</button><button class="light" onclick="adminTab('customers')">Customers</button><button class="light" onclick="adminTab('banks')">Banks / Lenders</button><button class="light" onclick="adminTab('cibil')">CIBIL Requests</button><button class="danger" onclick="logoutAdmin()">Logout</button></div><div id="adminView"></div></section>
</main>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalBox"></div></div>
<script>
const types=['Home Loan','Loan Against Property (LAP)','Business Loan','Personal Loan','Car Loan','Two-Wheeler Loan','Education Loan','Machinery Loan','Balance Transfer / Top-Up','Mortgage Loan','Loan Against Rent','Construction Loan'];
const icons=['🏠','🏢','💼','💳','🚗','🏍️','🎓','⚙️','🔄','🏦','🏠','🏗️'];
const defaultBanks=['State Bank of India','HDFC Bank','ICICI Bank','Axis Bank','Bank of Baroda','Punjab National Bank','Canara Bank','Union Bank of India','Kotak Mahindra Bank','IndusInd Bank','Bajaj Finance','Tata Capital'];
let banks=JSON.parse(localStorage.getItem('lc_banks')||'null')||defaultBanks.map((name,i)=>({id:'B'+(i+1),name,active:true}));
let apps=JSON.parse(localStorage.getItem('lc_apps')||'[]');let users=JSON.parse(localStorage.getItem('lc_users')||'[]');let cibil=JSON.parse(localStorage.getItem('lc_cibil')||'[]');let currentMobile=localStorage.getItem('lc_mobile')||'';let adminLogged=localStorage.getItem('lc_admin')==='1';let selected='';
const $=id=>document.getElementById(id); const save=()=>{localStorage.setItem('lc_apps',JSON.stringify(apps));localStorage.setItem('lc_users',JSON.stringify(users));localStorage.setItem('lc_banks',JSON.stringify(banks));localStorage.setItem('lc_cibil',JSON.stringify(cibil));};
function closeModal(){$('modal').classList.add('hidden')}
function openModal(html){$('modalBox').innerHTML=html+'<div class="tabs"><button class="light" onclick="closeModal()">Close</button></div>';$('modal').classList.remove('hidden')}
function showCustomer(){$('customer').classList.remove('hidden');$('admin').classList.add('hidden');renderMine()}
function openCustomerLogin(){openModal('<h2>Customer Mobile Login</h2><p class="small">Demo app में OTP flow local है। Production में SMS/OTP backend जोड़ना जरूरी है।</p><div class="field"><label>Mobile Number</label><input id="loginMobile" inputmode="numeric" maxlength="10"></div><div class="tabs"><button class="primary" onclick="sendOtp()">Send OTP</button></div><div id="otpArea"></div>')}
function sendOtp(){let m=$('loginMobile').value;if(!/^\d{10}$/.test(m)){alert('10 digit mobile number डालें');return}$('otpArea').innerHTML='<div class="field"><label>OTP</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="Demo OTP: 123456"></div><button class="primary" onclick="verifyOtp(\''+m+'\')">Verify OTP</button>'}
function verifyOtp(m){if($('otp').value!=='123456'){alert('Invalid OTP. Demo OTP 123456 है।');return}currentMobile=m;localStorage.setItem('lc_mobile',m);if(!users.some(u=>u.mobile===m))users.push({mobile:m,date:new Date().toLocaleDateString('en-IN')});save();closeModal();renderMine();alert('Login successful');}
function renderBanks(){let active=banks.filter(b=>b.active);$('bank').innerHTML='<option value="">Select lender</option>'+active.map(b=>'<option>'+b.name+'</option>').join('')}
types.forEach((x,i)=>{let d=document.createElement('div');d.className='loan';d.innerHTML='<div style="font-size:28px">'+icons[i]+'</div><h3>'+x+'</h3><small>Apply online</small>';d.onclick=()=>{selected=x;$('title').textContent=x;$('apply').classList.remove('hidden');renderBanks();scrollTo(0,$('apply').offsetTop)};$('loans').appendChild(d)});
function applyLoan(){let n=$('name').value.trim(),m=$('mobile').value.trim(),a=Number($('amount').value);if(!n||!/^[0-9]{10}$/.test(m)||!a){$('msg').innerHTML='<div class="msg">नाम, 10 digit mobile और loan amount भरना जरूरी है।</div>';return}let id='LC'+Date.now().toString().slice(-8);apps.push({id,name:n,mobile:m,pan:$('pan').value.trim().toUpperCase(),loan:selected,amount:a,income:Number($('income').value||0),bank:$('bank').value,status:'Applied',date:new Date().toLocaleDateString('en-IN')});currentMobile=m;localStorage.setItem('lc_mobile',m);if(!users.some(u=>u.mobile===m))users.push({mobile:m,date:new Date().toLocaleDateString('en-IN')});save();$('msg').innerHTML='<div class="msg"><b>Application submitted.</b><br>Application ID: '+id+'</div>';renderMine()}
function renderMine(){let list=apps.filter(a=>!currentMobile||a.mobile===currentMobile);if(!currentMobile){$('mine').innerHTML='Apni applications देखने के लिए <button class="primary" onclick="openCustomerLogin()">Mobile Login</button>';return}if(!list.length){$('mine').innerHTML='इस mobile पर कोई application नहीं मिली।';return}$('mine').innerHTML='<p class="small">Logged in: '+currentMobile+'</p><div class="tablewrap"><table><tr><th>ID</th><th>Loan</th><th>Amount</th><th>Bank</th><th>Status</th></tr>'+list.map(a=>'<tr><td>'+a.id+'</td><td>'+a.loan+'</td><td>₹'+a.amount.toLocaleString('en-IN')+'</td><td>'+(a.bank||'-')+'</td><td><span class="pill">'+a.status+'</span></td></tr>').join('')+'</table></div>'}
function openLogin(){openModal('<h2>Owner Admin Login</h2><p class="small">Demo owner login. Production में secure server-side authentication जरूरी है।</p><div class="field"><label>Owner Mobile</label><input id="adminMobile" inputmode="numeric" maxlength="10" placeholder="10 digit mobile"></div><div class="field"><label>Admin PIN</label><input id="adminPin" type="password" maxlength="8" placeholder="Demo PIN: 2580"></div><div class="tabs"><button class="primary" onclick="verifyAdmin()">Login</button></div>')}
function verifyAdmin(){if($('adminMobile').value.length===10&&$('adminPin').value==='2580'){adminLogged=true;localStorage.setItem('lc_admin','1');closeModal();$('customer').classList.add('hidden');$('admin').classList.remove('hidden');adminTab('dashboard')}else alert('Invalid admin login. Demo PIN 2580 है।')}
function logoutAdmin(){adminLogged=false;localStorage.removeItem('lc_admin');showCustomer()}
function adminTab(tab){if(!adminLogged){openLogin();return}if(tab==='dashboard')dashboard();if(tab==='apps')applications();if(tab==='customers')customers();if(tab==='banks')bankManager();if(tab==='cibil')cibilManager()}
function dashboard(){$('adminView').innerHTML='<div class="stats"><div class="stat">Applications<b>'+apps.length+'</b></div><div class="stat">Customers<b>'+users.length+'</b></div><div class="stat">Pending<b>'+apps.filter(a=>a.status==='Applied'||a.status==='Under Process').length+'</b></div><div class="stat">Approved<b>'+apps.filter(a=>a.status==='Approved').length+'</b></div><div class="stat">CIBIL Requests<b>'+cibil.length+'</b></div></div><div class="panel"><h3>Admin controls</h3><p>Application status, customer records, lender list और CIBIL request records यहीं manage किए जा सकते हैं।</p></div>'}
function applications(){let rows=apps.map((a,i)=>'<tr><td>'+a.id+'</td><td><b>'+a.name+'</b><br>'+a.mobile+(a.pan?'<br>PAN: '+a.pan:'')+'</td><td>'+a.loan+'</td><td>₹'+a.amount.toLocaleString('en-IN')+'</td><td>'+(a.bank||'-')+'</td><td><select onchange="changeStatus('+i+',this.value)"><option '+(a.status==='Applied'?'selected':'')+'>Applied</option><option '+(a.status==='Under Process'?'selected':'')+'>Under Process</option><option '+(a.status==='Approved'?'selected':'')+'>Approved</option><option '+(a.status==='Rejected'?'selected':'')+'>Rejected</option><option '+(a.status==='Disbursed'?'selected':'')+'>Disbursed</option></select></td><td><button class="danger" onclick="deleteApp('+i+')">Delete</button></td></tr>').join('');$('adminView').innerHTML='<div class="panel"><h2>All Applications</h2><div class="tablewrap"><table><tr><th>ID</th><th>Customer</th><th>Loan</th><th>Amount</th><th>Lender</th><th>Status</th><th>Action</th></tr>'+rows+'</table></div></div>'}
function changeStatus(i,s){apps[i].status=s;save();applications()}
function deleteApp(i){if(confirm('Delete this application?')){apps.splice(i,1);save();applications()}}
function customers(){let rows=users.map((u,i)=>{let count=apps.filter(a=>a.mobile===u.mobile).length;return '<tr><td>'+u.mobile+'</td><td>'+u.date+'</td><td>'+count+'</td><td><button class="light" onclick="viewCustomer(\''+u.mobile+'\')">View</button></td></tr>'}).join('');$('adminView').innerHTML='<div class="panel"><h2>Customers</h2><div class="tablewrap"><table><tr><th>Mobile</th><th>Joined</th><th>Applications</th><th>Action</th></tr>'+rows+'</table></div></div>'}
function viewCustomer(m){let x=apps.filter(a=>a.mobile===m);openModal('<h2>Customer: '+m+'</h2>'+(!x.length?'<p>No applications.</p>':'<div class="tablewrap"><table><tr><th>ID</th><th>Loan</th><th>Amount</th><th>Status</th></tr>'+x.map(a=>'<tr><td>'+a.id+'</td><td>'+a.loan+'</td><td>₹'+a.amount.toLocaleString('en-IN')+'</td><td>'+a.status+'</td></tr>').join('')+'</table></div>'))}
function bankManager(){let rows=banks.map((b,i)=>'<tr><td>'+b.name+'</td><td>'+(b.active?'Active':'Disabled')+'</td><td><button class="light" onclick="toggleBank('+i+')">'+(b.active?'Disable':'Enable')+'</button> <button class="danger" onclick="deleteBank('+i+')">Delete</button></td></tr>').join('');$('adminView').innerHTML='<div class="panel"><h2>Banks / Lenders</h2><div class="form"><div class="field"><label>Add Bank / NBFC</label><input id="newBank" placeholder="Lender name"></div><div><label>&nbsp;</label><button class="primary" onclick="addBank()">Add Lender</button></div></div><div class="tablewrap"><table><tr><th>Lender</th><th>Status</th><th>Action</th></tr>'+rows+'</table></div></div>'}
function addBank(){let n=$('newBank').value.trim();if(n){banks.push({id:'B'+Date.now(),name:n,active:true});save();bankManager()}}
function toggleBank(i){banks[i].active=!banks[i].active;save();bankManager()}
function deleteBank(i){if(confirm('Delete lender?')){banks.splice(i,1);save();bankManager()}}
function cibilRequest(){let pan=$('pan').value.trim().toUpperCase();if(!currentMobile){alert('पहले Mobile Login करें।');return}if(!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(pan)){alert('Valid PAN डालें।');return}let id='CB'+Date.now().toString().slice(-8);cibil.push({id,mobile:currentMobile,pan,date:new Date().toLocaleDateString('en-IN'),status:'Requested'});save();$('msg').innerHTML='<div class="msg"><b>CIBIL request recorded.</b><br>Request ID: '+id+'<br><small>Real CIBIL report अभी इस APK में connected नहीं है। Authorized CIBIL/member/provider backend और customer consent के बाद live report fetch होगा।</small></div>'}
function cibilManager(){let rows=cibil.map((c,i)=>'<tr><td>'+c.id+'</td><td>'+c.mobile+'</td><td>'+c.pan+'</td><td>'+c.date+'</td><td><select onchange="cibilStatus('+i+',this.value)"><option '+(c.status==='Requested'?'selected':'')+'>Requested</option><option '+(c.status==='Checked'?'selected':'')+'>Checked</option><option '+(c.status==='Failed'?'selected':'')+'>Failed</option></select></td><td><button class="light" onclick="showCibilInfo()">Integration Info</button></td></tr>').join('');$('adminView').innerHTML='<div class="panel"><h2>CIBIL Requests</h2><p class="small">No fake score/report is generated. Live CIBIL needs an authorized integration.</p><div class="tablewrap"><table><tr><th>Request</th><th>Mobile</th><th>PAN</th><th>Date</th><th>Status</th><th>Action</th></tr>'+rows+'</table></div></div>'}
function cibilStatus(i,s){cibil[i].status=s;save();cibilManager()}
function showCibilInfo(){openModal('<h2>Real CIBIL Integration</h2><p>Live CIBIL Score/Report के लिए TransUnion CIBIL या authorized provider/member integration, customer consent, KYC flow और secure backend/API की जरूरत है.</p><p class="small">API credentials APK में नहीं रखे जाएंगे। Backend response मिलने पर score/report को customer और owner panel में securely दिखाया जा सकता है.</p>')}
renderBanks();renderMine();if(adminLogged){$('customer').classList.add('hidden');$('admin').classList.remove('hidden');adminTab('dashboard')}
</script>
</body></html>
