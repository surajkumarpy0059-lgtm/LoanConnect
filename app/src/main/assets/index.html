<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoanConnect</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}header{background:#073b78;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.brand{font-size:24px;font-weight:800}.brand b{color:#ff9b14}button{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#1167d8;color:#fff}.light{background:#e8eef7;color:#073b78}.danger{background:#fee2e2;color:#b42318}.hidden{display:none!important}main{max-width:1150px;margin:auto;padding:16px}.hero,.panel,.loan{background:#fff;border:1px solid #dfe6ef;border-radius:15px;padding:17px;margin-bottom:14px}.hero{background:linear-gradient(135deg,#073b78,#1167d8);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.loan{cursor:pointer}.loan:hover{box-shadow:0 6px 20px #0001}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field input,.field select{padding:11px;border:1px solid #ccd5e2;border-radius:8px;width:100%}.tabs,.nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.msg{padding:11px;border-radius:9px;background:#eef7ff;margin-top:10px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat{padding:14px;border:1px solid #e2e7ee;border-radius:12px;background:#fff}.stat b{display:block;font-size:24px;margin-top:5px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:9px;border-bottom:1px solid #e5e9ef;text-align:left;font-size:13px}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#eaf7ef;color:#147a3d;font-size:12px;font-weight:bold}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.box{background:#fff;border-radius:15px;padding:20px;width:min(480px,100%);max-height:90vh;overflow:auto}.small{font-size:12px;color:#65738a}@media(max-width:600px){main{padding:10px}.brand{font-size:20px}}
</style></head><body><header><div class="brand">Loan<b>Connect</b></div><div><button class="light" onclick="customerPage()">Customer</button> <button class="light" onclick="adminLogin()">🔐 Admin</button></div></header><main><section id="customer"><div class="hero"><h1>हर सपने के लिए सही Loan</h1><p>Loan application और status tracking एक जगह।</p><button class="light" onclick="customerLogin()">Customer Mobile Login</button></div><div class="panel"><h2>Loan Types</h2><div id="loans" class="grid"></div></div><div id="apply" class="panel hidden"><h2 id="loanTitle">Loan Application</h2><div class="form"><div class="field"><label>Name *</label><input id="name"></div><div class="field"><label>Mobile *</label><input id="mobile" inputmode="numeric" maxlength="10"></div><div class="field"><label>PAN</label><input id="pan" maxlength="10"></div><div class="field"><label>Monthly Income</label><input id="income" type="number"></div><div class="field"><label>Loan Amount *</label><input id="amount" type="number"></div><div class="field"><label>Bank / Lender</label><select id="bank"></select></div></div><div class="tabs"><button class="primary" onclick="applyLoan()">Apply Now</button><button class="light" onclick="requestCibil()">Check CIBIL</button></div><div id="msg"></div></div><div class="panel"><h2>My Applications</h2><div id="mine">Customer Login करें।</div></div></section><section id="admin" class="hidden"><div class="hero"><h1>Owner Admin Panel</h1><p>Applications, customers, lenders और CIBIL requests manage करें।</p></div><div class="nav"><button class="light" onclick="adminTab('dashboard')">Dashboard</button><button class="light" onclick="adminTab('apps')">Applications</button><button class="light" onclick="adminTab('customers')">Customers</button><button class="light" onclick="adminTab('banks')">Banks / Lenders</button><button class="light" onclick="adminTab('cibil')">CIBIL Requests</button><button class="danger" onclick="adminLogout()">Logout</button></div><div id="adminView"></div></section></main><div id="modal" class="modal hidden"><div id="box" class="box"></div></div><script>
const API=(location.protocol==='file:')?null:'/api';const loans=['Home Loan','Loan Against Property (LAP)','Business Loan','Personal Loan','Car Loan','Two-Wheeler Loan','Education Loan','Machinery Loan','Balance Transfer / Top-Up','Mortgage Loan','Loan Against Rent','Construction Loan'];const icons=['🏠','🏢','💼','💳','🚗','🏍️','🎓','⚙️','🔄','🏦','🏠','🏗️'];const defaultBanks=['State Bank of India','HDFC Bank','ICICI Bank','Axis Bank','Bank of Baroda','Punjab National Bank','Canara Bank','Union Bank of India','Kotak Mahindra Bank','IndusInd Bank','Bajaj Finance','Tata Capital'];let selected='';let adminToken=sessionStorage.getItem('adminToken')||'';let customerToken=sessionStorage.getItem('customerToken')||'';let localAdmin=localStorage.getItem('lc_admin')==='1';let apps=JSON.parse(localStorage.getItem('lc_apps')||'[]');let users=JSON.parse(localStorage.getItem('lc_users')||'[]');let banks=JSON.parse(localStorage.getItem('lc_banks')||'null')||defaultBanks.map((name,i)=>({id:'B'+(i+1),name,active:true}));let cibil=JSON.parse(localStorage.getItem('lc_cibil')||'[]');const $=x=>document.getElementById(x);function save(){localStorage.setItem('lc_apps',JSON.stringify(apps));localStorage.setItem('lc_users',JSON.stringify(users));localStorage.setItem('lc_banks',JSON.stringify(banks));localStorage.setItem('lc_cibil',JSON.stringify(cibil))}function modal(h){$('box').innerHTML=h+'<div class="tabs"><button class="light" onclick="closeModal()">Close</button></div>';$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}function customerPage(){$('customer').classList.remove('hidden');$('admin').classList.add('hidden');loadMine()}function adminLogin(){modal('<h2>🔐 Owner Admin Login</h2><p class="small">Admin panel खोलने के लिए 10 digit mobile और PIN डालें।</p><div class="field"><label>Owner Mobile</label><input id="am" inputmode="numeric" maxlength="10" placeholder="10 digit mobile"></div><div class="field"><label>Admin PIN</label><input id="ap" type="password" maxlength="8" placeholder="PIN"></div><button class="primary" onclick="doAdminLogin()">Login to Admin</button>')}async function doAdminLogin(){let m=$('am').value.trim(),p=$('ap').value.trim();if(!/^\d{10}$/.test(m)){alert('10 digit mobile number डालें');return}if(API){try{let d=await api('/admin/login',{method:'POST',body:JSON.stringify({mobile:m,pin:p})});adminToken=d.token;sessionStorage.setItem('adminToken',adminToken);openAdmin();return}catch(e){if(p!=='2580'){alert(e.message);return}}}if(p!=='2580'){alert('Invalid Admin PIN');return}localAdmin=true;localStorage.setItem('lc_admin','1');closeModal();openAdmin()}function openAdmin(){closeModal();$('customer').classList.add('hidden');$('admin').classList.remove('hidden');adminTab('dashboard')}function adminLogout(){adminToken='';localAdmin=false;sessionStorage.removeItem('adminToken');localStorage.removeItem('lc_admin');customerPage()}async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};if(path.startsWith('/admin')&&adminToken)opt.headers.Authorization='Bearer '+adminToken;if(!path.startsWith('/admin')&&customerToken)opt.headers.Authorization='Bearer '+customerToken;let r=await fetch(API+path,opt);let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function customerLogin(){modal('<h2>Customer Mobile Login</h2><div class="field"><label>Mobile Number</label><input id="cm" inputmode="numeric" maxlength="10"></div><button class="primary" onclick="sendOtp()">Send OTP</button><div id="otpArea"></div>')}async function sendOtp(){let m=$('cm').value.trim();if(!/^\d{10}$/.test(m)){alert('10 digit mobile number डालें');return}if(!API){$('otpArea').innerHTML='<div class="field"><label>Demo OTP</label><input id="otp" maxlength="6" placeholder="123456"></div><button class="primary" onclick="verifyLocalOtp()">Verify</button>';return}try{await api('/customer/request-otp',{method:'POST',body:JSON.stringify({mobile:m})});$('otpArea').innerHTML='<div class="field"><label>OTP</label><input id="otp" maxlength="6"></div><button class="primary" onclick="verifyOtp()">Verify OTP</button>'}catch(e){alert(e.message)}}function verifyLocalOtp(){if($('otp').value!=='123456'){alert('Demo OTP 123456 है');return}customerToken='local';sessionStorage.setItem('customerToken','local');let m=$('cm').value.trim();if(!users.some(x=>x.mobile===m))users.push({mobile:m,date:new Date().toLocaleDateString('en-IN')});save();closeModal();loadMine()}async function verifyOtp(){try{let d=await api('/customer/verify-otp',{method:'POST',body:JSON.stringify({mobile:$('cm').value.trim(),otp:$('otp').value.trim()})});customerToken=d.token;sessionStorage.setItem('customerToken',customerToken);closeModal();loadMine()}catch(e){alert(e.message)}}function loadBanks(){if(API){api('/lenders').then(b=>{$('bank').innerHTML='<option value="">Select lender</option>'+b.filter(x=>x.active).map(x=>'<option>'+x.name+'</option>').join('')}).catch(()=>localBanks())}else localBanks()}function localBanks(){$('bank').innerHTML='<option value="">Select lender</option>'+banks.filter(x=>x.active).map(x=>'<option>'+x.name+'</option>').join('')}function chooseLoan(x){selected=x;$('loanTitle').textContent=x;$('apply').classList.remove('hidden');loadBanks();$('apply').scrollIntoView({behavior:'smooth'})}async function applyLoan(){let body={name:$('name').value.trim(),mobile:$('mobile').value.trim(),pan:$('pan').value.trim().toUpperCase(),income:$('income').value,amount:$('amount').value,loan:selected,bank:$('bank').value};if(!body.name||!/^\d{10}$/.test(body.mobile)||!body.amount){$('msg').innerHTML='<div class="msg">Name, 10 digit mobile और loan amount जरूरी है।</div>';return}if(API&&customerToken&&customerToken!=='local'){try{let d=await api('/applications',{method:'POST',body:JSON.stringify(body)});$('msg').innerHTML='<div class="msg"><b>Application submitted.</b><br>ID: '+d.id+'</div>';loadMine();return}catch(e){$('msg').innerHTML='<div class="msg">'+e.message+'</div>';return}}let id='LC'+Date.now().toString().slice(-8);apps.push({...body,id,status:'Applied',date:new Date().toLocaleDateString('en-IN'),amount:Number(body.amount),income:Number(body.income||0)});if(!users.some(x=>x.mobile===body.mobile))users.push({mobile:body.mobile,date:new Date().toLocaleDateString('en-IN')});save();$('msg').innerHTML='<div class="msg"><b>Application submitted.</b><br>Application ID: '+id+'</div>';loadMine()}function loadMine(){if(!customerToken){$('mine').innerHTML='Customer Mobile Login करें।';return}if(API&&customerToken!=='local'){api('/applications/me').then(a=>renderMine(a)).catch(e=>$('mine').innerHTML=e.message);return}renderMine(apps)}function renderMine(a){if(!a.length){$('mine').innerHTML='No applications found.';return}$('mine').innerHTML='<div class="tablewrap"><table><tr><th>ID</th><th>Loan</th><th>Amount</th><th>Lender</th><th>Status</th></tr>'+a.filter(x=>!x.mobile||!localStorage.getItem('lc_mobile')||x.mobile===localStorage.getItem('lc_mobile')).map(x=>'<tr><td>'+x.id+'</td><td>'+x.loan+'</td><td>₹'+Number(x.amount).toLocaleString('en-IN')+'</td><td>'+(x.bank||'-')+'</td><td><span class="pill">'+x.status+'</span></td></tr>').join('')+'</table></div>'}async function requestCibil(){if(!customerToken){alert('पहले Customer Login करें');return}if(API&&customerToken!=='local'){try{let d=await api('/cibil-requests',{method:'POST',body:JSON.stringify({pan:$('pan').value})});$('msg').innerHTML='<div class="msg">Request created: '+d.id+'<br>Real CIBIL report के लिए authorized provider integration जरूरी है।</div>';return}catch(e){alert(e.message);return}}cibil.push({id:'CB'+Date.now().toString().slice(-8),mobile:'local',pan:$('pan').value,status:'Pending'});save();$('msg').innerHTML='<div class="msg">CIBIL request saved. Real score generate नहीं किया गया है।</div>'}async function adminTab(t){if(!(adminToken||localAdmin)){adminLogin();return}if(API&&adminToken){try{if(t==='dashboard'){let d=await api('/admin/dashboard');return showDashboard(d)}if(t==='apps'){let a=await api('/admin/applications');return showApps(a)}if(t==='customers'){let a=await api('/admin/customers');return showCustomers(a)}if(t==='banks'){let a=await api('/lenders');return showBanks(a)}if(t==='cibil'){let a=await api('/admin/cibil');return showCibil(a)}}catch(e){if(!localAdmin)alert(e.message)}}if(t==='dashboard')showDashboard({applications:apps.length,customers:users.length,pending:apps.filter(x=>['Applied','Under Process'].includes(x.status)).length,approved:apps.filter(x=>x.status==='Approved').length,cibil:cibil.length});if(t==='apps')showApps(apps);if(t==='customers')showCustomers(users);if(t==='banks')showBanks(banks);if(t==='cibil')showCibil(cibil)}function showDashboard(d){$('adminView').innerHTML='<div class="stats">'+[['Applications',d.applications],['Customers',d.customers],['Pending',d.pending],['Approved',d.approved],['CIBIL Requests',d.cibil]].map(x=>'<div class="stat">'+x[0]+'<b>'+x[1]+'</b></div>').join('')+'</div><div class="panel"><h3>Owner Controls</h3><p>Applications, customers, lenders और CIBIL requests manage करें।</p></div>'}function showApps(a){$('adminView').innerHTML='<div class="panel"><h2>All Applications</h2><div class="tablewrap"><table><tr><th>ID</th><th>Customer</th><th>Loan</th><th>Amount</th><th>Lender</th><th>Status</th></tr>'+a.map((x,i)=>'<tr><td>'+x.id+'</td><td>'+x.name+'<br>'+x.mobile+'</td><td>'+x.loan+'</td><td>₹'+Number(x.amount).toLocaleString('en-IN')+'</td><td>'+(x.bank||'-')+'</td><td><select onchange="setStatus(\''+x.id+'\',this.value,'+i+')"><option>Applied</option><option>Under Process</option><option>Approved</option><option>Rejected</option><option>Disbursed</option></select></td></tr>').join('')+'</table></div></div>'}async function setStatus(id,s,i){if(API&&adminToken){try{await api('/admin/applications/'+id,{method:'PATCH',body:JSON.stringify({status:s})});adminTab('apps');return}catch(e){alert(e.message);return}}let x=apps.find(a=>a.id===id)||apps[i];if(x)x.status=s;save();adminTab('apps')}function showCustomers(a){$('adminView').innerHTML='<div class="panel"><h2>Customers</h2><div class="tablewrap"><table><tr><th>Mobile</th><th>Date</th><th>Applications</th></tr>'+a.map(x=>'<tr><td>'+x.mobile+'</td><td>'+(x.date||x.created_at||'-')+'</td><td>'+(x.applications||apps.filter(y=>y.mobile===x.mobile).length)+'</td></tr>').join('')+'</table></div></div>'}function showBanks(a){$('adminView').innerHTML='<div class="panel"><h2>Banks / Lenders</h2><div class="form"><div class="field"><label>New lender</label><input id="newBank"></div><button class="primary" onclick="addBank()">Add</button></div><div class="tablewrap"><table><tr><th>Name</th><th>Status</th><th>Action</th></tr>'+a.map(x=>'<tr><td>'+x.name+'</td><td>'+(x.active?'Active':'Disabled')+'</td><td><button class="light" onclick="toggleBank(\''+x.id+'\','+(!x.active)+')">'+(x.active?'Disable':'Enable')+'</button></td></tr>').join('')+'</table></div></div>'}async function addBank(){let n=$('newBank').value.trim();if(!n)return;if(API&&adminToken){try{await api('/admin/lenders',{method:'POST',body:JSON.stringify({name:n})});adminTab('banks');return}catch(e){alert(e.message);return}}banks.push({id:'B'+Date.now(),name:n,active:true});save();adminTab('banks')}async function toggleBank(id,a){if(API&&adminToken){try{await api('/admin/lenders/'+id,{method:'PATCH',body:JSON.stringify({active:a})});adminTab('banks');return}catch(e){alert(e.message);return}}let x=banks.find(b=>b.id===id);if(x)x.active=a;save();adminTab('banks')}function showCibil(a){$('adminView').innerHTML='<div class="panel"><h2>CIBIL Requests</h2><p class="small">Fake score नहीं बनाया जाता। Live report के लिए authorized CIBIL provider integration जरूरी है।</p><div class="tablewrap"><table><tr><th>ID</th><th>Mobile</th><th>PAN</th><th>Status</th></tr>'+a.map(x=>'<tr><td>'+x.id+'</td><td>'+x.mobile+'</td><td>'+x.pan+'</td><td>'+x.status+'</td></tr>').join('')+'</table></div></div>'}loans.forEach((x,i)=>{let d=document.createElement('div');d.className='loan';d.innerHTML='<div style="font-size:28px">'+icons[i]+'</div><h3>'+x+'</h3><small>Apply online</small>';d.onclick=()=>chooseLoan(x);$('loans').appendChild(d)});customerPage();</script></body></html>
