<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoanConnect</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:#073b78;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.brand{font-size:24px;font-weight:800}.brand b{color:#ff9b14}main{max-width:1150px;margin:auto;padding:16px}.hero,.panel,.loan{background:#fff;border:1px solid #dfe6ef;border-radius:15px;padding:18px;margin-bottom:14px}.hero{background:linear-gradient(135deg,#073b78,#1167d8);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.loan{cursor:pointer}.loan h3{font-size:17px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field input,.field select{padding:11px;border:1px solid #ccd5e2;border-radius:8px;width:100%}button{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#1167d8;color:#fff}.light{background:#e8eef7;color:#073b78}.danger{background:#fee2e2;color:#b42318}.tabs,.nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.stat{background:#fff;border:1px solid #e2e7ee;border-radius:12px;padding:14px}.stat b{display:block;font-size:25px;margin-top:5px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:9px;border-bottom:1px solid #e5e9ef;text-align:left;font-size:13px}.msg{padding:12px;border-radius:9px;background:#eef7ff;margin-top:10px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.box{background:#fff;border-radius:15px;padding:20px;width:min(470px,100%)}.small{font-size:12px;color:#65738a}@media(max-width:600px){main{padding:10px}.brand{font-size:20px}}</style></head><body><header><div class="brand">Loan<b>Connect</b></div><div><button class="light" onclick="customerPage()">Customer</button> <button class="light" onclick="adminLogin()">Admin</button></div></header><main><section id="customer"><div class="hero"><h1>हर सपने के लिए सही Loan</h1><p>Apply, track और lender selection एक जगह।</p><button class="light" onclick="customerLogin()">Customer Mobile Login</button></div><div class="panel"><h2>Loan Types</h2><div id="loans" class="grid"></div></div><div id="apply" class="panel hidden"><h2 id="loanTitle">Loan Application</h2><div class="form"><div class="field"><label>Name *</label><input id="name"></div><div class="field"><label>Mobile *</label><input id="mobile" inputmode="numeric" maxlength="10"></div><div class="field"><label>PAN</label><input id="pan" maxlength="10"></div><div class="field"><label>Monthly Income</label><input id="income" type="number"></div><div class="field"><label>Loan Amount *</label><input id="amount" type="number"></div><div class="field"><label>Bank / Lender</label><select id="bank"></select></div></div><div class="tabs"><button class="primary" onclick="applyLoan()">Apply Now</button><button class="light" onclick="requestCibil()">Check CIBIL</button></div><div id="msg"></div></div><div class="panel"><h2>My Applications</h2><div id="mine">Login करके applications देखें।</div></div></section><section id="admin" class="hidden"><div class="hero"><h1>Owner Admin Panel</h1><p>Applications, customers, lenders और CIBIL requests.</p></div><div class="nav"><button class="light" onclick="adminTab('dashboard')">Dashboard</button><button class="light" onclick="adminTab('apps')">Applications</button><button class="light" onclick="adminTab('customers')">Customers</button><button class="light" onclick="adminTab('banks')">Banks / Lenders</button><button class="light" onclick="adminTab('cibil')">CIBIL Requests</button><button class="danger" onclick="adminLogout()">Logout</button></div><div id="adminView"></div></section></main><div id="modal" class="modal hidden"><div id="box" class="box"></div></div><script>
const API='/api';const loans=['Home Loan','Loan Against Property (LAP)','Business Loan','Personal Loan','Car Loan','Two-Wheeler Loan','Education Loan','Machinery Loan','Balance Transfer / Top-Up','Mortgage Loan','Loan Against Rent','Construction Loan'];let selected='';let customerToken=sessionStorage.getItem('customerToken')||'';let adminToken=sessionStorage.getItem('adminToken')||'';const $=x=>document.getElementById(x);async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};if(path.startsWith('/admin')&&adminToken)opt.headers.Authorization='Bearer '+adminToken;if(!path.startsWith('/admin')&&customerToken)opt.headers.Authorization='Bearer '+customerToken;let r=await fetch(API+path,opt);let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}function modal(h){$('box').innerHTML=h+'<div class="tabs"><button class="light" onclick="closeModal()">Close</button></div>';$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}function customerPage(){$('customer').classList.remove('hidden');$('admin').classList.add('hidden');loadMine()}function adminLogin(){modal('<h2>Owner Admin Login</h2><p class="small">Admin credentials server पर सुरक्षित रखे जाते हैं।</p><div class="field"><label>Owner Mobile</label><input id="am" inputmode="numeric" maxlength="10"></div><div class="field"><label>Admin PIN</label><input id="ap" type="password"></div><button class="primary" onclick="doAdminLogin()">Login</button>')}async function doAdminLogin(){try{let d=await api('/admin/login',{method:'POST',body:JSON.stringify({mobile:$('am').value,pin:$('ap').value})});adminToken=d.token;sessionStorage.setItem('adminToken',adminToken);closeModal();$('customer').classList.add('hidden');$('admin').classList.remove('hidden');adminTab('dashboard')}catch(e){alert(e.message)}}function adminLogout(){adminToken='';sessionStorage.removeItem('adminToken');customerPage()}function customerLogin(){modal('<h2>Customer Mobile Login</h2><div class="field"><label>Mobile Number</label><input id="cm" inputmode="numeric" maxlength="10"></div><button class="primary" onclick="sendOtp()">Send OTP</button><div id="otpArea"></div>')}async function sendOtp(){try{await api('/customer/request-otp',{method:'POST',body:JSON.stringify({mobile:$('cm').value})});$('otpArea').innerHTML='<div class="field"><label>OTP</label><input id="otp" inputmode="numeric" maxlength="6"></div><button class="primary" onclick="verifyOtp()">Verify OTP</button><p class="small">Live SMS OTP provider configure होने पर OTP SMS से आएगा।</p>'}catch(e){alert(e.message)}}async function verifyOtp(){try{let d=await api('/customer/verify-otp',{method:'POST',body:JSON.stringify({mobile:$('cm').value,otp:$('otp').value})});customerToken=d.token;sessionStorage.setItem('customerToken',customerToken);closeModal();loadMine()}catch(e){alert(e.message)}}async function loadBanks(){try{let b=await api('/lenders');$('bank').innerHTML='<option value="">Select lender</option>'+b.filter(x=>x.active).map(x=>'<option>'+x.name+'</option>').join('')}catch(e){$('bank').innerHTML='<option>Backend unavailable</option>'}}function chooseLoan(x){selected=x;$('loanTitle').textContent=x;$('apply').classList.remove('hidden');loadBanks();$('apply').scrollIntoView({behavior:'smooth'})}async function applyLoan(){if(!customerToken){alert('पहले Customer Mobile Login करें');return}let body={name:$('name').value,mobile:$('mobile').value,pan:$('pan').value,income:$('income').value,amount:$('amount').value,loan:selected,bank:$('bank').value};try{let d=await api('/applications',{method:'POST',body:JSON.stringify(body)});$('msg').innerHTML='<div class="msg"><b>Application submitted.</b><br>Application ID: '+d.id+'</div>';loadMine()}catch(e){$('msg').innerHTML='<div class="msg">'+e.message+'</div>'}}async function loadMine(){if(!customerToken){$('mine').innerHTML='Customer Mobile Login करें।';return}try{let a=await api('/applications/me');$('mine').innerHTML=a.length?'<div class="tablewrap"><table><tr><th>ID</th><th>Loan</th><th>Amount</th><th>Lender</th><th>Status</th></tr>'+a.map(x=>'<tr><td>'+x.id+'</td><td>'+x.loan+'</td><td>₹'+Number(x.amount).toLocaleString('en-IN')+'</td><td>'+(x.bank||'-')+'</td><td>'+x.status+'</td></tr>').join('')+'</table></div>':'No applications found.'}catch(e){$('mine').innerHTML=e.message}}async function requestCibil(){if(!customerToken){alert('पहले Customer Login करें');return}try{let d=await api('/cibil-requests',{method:'POST',body:JSON.stringify({pan:$('pan').value})});$('msg').innerHTML='<div class="msg">CIBIL request created: '+d.id+'<br>Real report के लिए authorized CIBIL provider integration जरूरी है.</div>'}catch(e){alert(e.message)}}async function adminTab(t){if(!adminToken)return adminLogin();try{if(t==='dashboard'){let d=await api('/admin/dashboard');$('adminView').innerHTML='<div class="stats">'+[['Applications',d.applications],['Customers',d.customers],['Pending',d.pending],['Approved',d.approved],['CIBIL',d.cibil]].map(x=>'<div class="stat">'+x[0]+'<b>'+x[1]+'</b></div>').join('')+'</div>'}else if(t==='apps'){let a=await api('/admin/applications');$('adminView').innerHTML='<div class="panel"><h2>All Applications</h2><div class="tablewrap"><table><tr><th>ID</th><th>Customer</th><th>Loan</th><th>Amount</th><th>Lender</th><th>Status</th><th></th></tr>'+a.map(x=>'<tr><td>'+x.id+'</td><td>'+x.name+'<br>'+x.mobile+'</td><td>'+x.loan+'</td><td>₹'+Number(x.amount).toLocaleString('en-IN')+'</td><td>'+(x.bank||'-')+'</td><td><select onchange="statusApp(\''+x.id+'\',this.value)"><option '+(x.status==='Applied'?'selected':'')+'>Applied</option><option '+(x.status==='Under Process'?'selected':'')+'>Under Process</option><option '+(x.status==='Approved'?'selected':'')+'>Approved</option><option '+(x.status==='Rejected'?'selected':'')+'>Rejected</option><option '+(x.status==='Disbursed'?'selected':'')+'>Disbursed</option></select></td><td><button class="danger" onclick="deleteApp(\''+x.id+'\')">Delete</button></td></tr>').join('')+'</table></div></div>'}else if(t==='customers'){let a=await api('/admin/customers');$('adminView').innerHTML='<div class="panel"><h2>Customers</h2><div class="tablewrap"><table><tr><th>Mobile</th><th>Joined</th><th>Applications</th></tr>'+a.map(x=>'<tr><td>'+x.mobile+'</td><td>'+x.created_at+'</td><td>'+x.applications+'</td></tr>').join('')+'</table></div></div>'}else if(t==='banks'){let a=await api('/lenders');$('adminView').innerHTML='<div class="panel"><h2>Banks / Lenders</h2><div class="form"><div class="field"><label>New lender</label><input id="newBank"></div><button class="primary" onclick="addBank()">Add</button></div><div class="tablewrap"><table><tr><th>Name</th><th>Status</th><th>Action</th></tr>'+a.map(x=>'<tr><td>'+x.name+'</td><td>'+ (x.active?'Active':'Disabled')+'</td><td><button class="light" onclick="toggleBank(\''+x.id+'\','+(!x.active)+')">'+(x.active?'Disable':'Enable')+'</button><button class="danger" onclick="delBank(\''+x.id+'\')">Delete</button></td></tr>').join('')+'</table></div></div>'}else{let a=await api('/admin/cibil');$('adminView').innerHTML='<div class="panel"><h2>CIBIL Requests</h2><p class="small">No fake score is generated. Authorized CIBIL integration required for live reports.</p><div class="tablewrap"><table><tr><th>ID</th><th>Mobile</th><th>PAN</th><th>Status</th></tr>'+a.map(x=>'<tr><td>'+x.id+'</td><td>'+x.mobile+'</td><td>'+x.pan+'</td><td>'+x.status+'</td></tr>').join('')+'</table></div></div>'}}catch(e){alert(e.message)}}async function statusApp(id,s){await api('/admin/applications/'+id,{method:'PATCH',body:JSON.stringify({status:s})});adminTab('apps')}async function deleteApp(id){if(confirm('Delete application?')){await api('/admin/applications/'+id,{method:'DELETE'});adminTab('apps')}}async function addBank(){let n=$('newBank').value.trim();if(n){await api('/admin/lenders',{method:'POST',body:JSON.stringify({name:n})});adminTab('banks')}}async function toggleBank(id,a){await api('/admin/lenders/'+id,{method:'PATCH',body:JSON.stringify({active:a})});adminTab('banks')}async function delBank(id){if(confirm('Delete lender?')){await api('/admin/lenders/'+id,{method:'DELETE'});adminTab('banks')}}loans.forEach((x,i)=>{let d=document.createElement('div');d.className='loan';d.innerHTML='<div style="font-size:28px">'+['🏠','🏢','💼','💳','🚗','🏍️','🎓','⚙️','🔄','🏦','🏠','🏗️'][i]+'</div><h3>'+x+'</h3><small>Apply online</small>';d.onclick=()=>chooseLoan(x);$('loans').appendChild(d)});customerPage();</script></body></html>
