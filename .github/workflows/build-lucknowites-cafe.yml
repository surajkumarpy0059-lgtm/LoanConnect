name: Build Lucknowites Cafe APK
on:
  workflow_dispatch:
  push:
    paths:
      - "LucknowitesCafe/**"
      - ".github/workflows/build-lucknowites-cafe.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Lucknowites Cafe debug APK
        run: gradle -p LucknowitesCafe :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LucknowitesCafe-debug-apk
          path: LucknowitesCafe/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

